name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Vars de runtime exigidas para validar que a app sobe na build do Next e
    # para o postinstall `prisma generate` resolver `prisma.config.ts`. Valores
    # fake só atravessam o build (não conectam em nada).
    env:
      ADMIN_PASSWORD: ci-fake-password
      ADMIN_SECRET: ci-fake-secret-precisa-de-32-chars-no-minimo-aqui
      UNIFI_URL: https://example.invalid
      UNIFI_USERNAME: ci
      UNIFI_PASSWORD: ci
      DATABASE_URL: file:./prisma/dev.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migrations apply cleanly
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build
