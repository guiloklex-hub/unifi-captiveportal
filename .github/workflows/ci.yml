name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Vars de runtime exigidas para validar que a app sobe na build do Next e
    # para o postinstall `prisma generate` resolver `prisma.config.ts`. Valores
    # fake só atravessam o build (não conectam em nada).
    env:
      ADMIN_PASSWORD: ci-fake-password
      ADMIN_SECRET: ci-fake-secret-precisa-de-32-chars-no-minimo-aqui
      UNIFI_URL: https://example.invalid
      UNIFI_USERNAME: ci
      UNIFI_PASSWORD: ci
      DATABASE_URL: file:./prisma/dev.db

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migrations apply cleanly
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

  e2e:
    name: e2e (Playwright + UniFi simulada)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./prisma/dev.db
      ADMIN_SECRET: ci-fake-secret-precisa-de-32-chars-no-minimo-aqui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: docker (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg GIT_SHA=${GITHUB_SHA::7} -t unifi-captive-portal:ci .

      - name: Smoke test (migrações + healthcheck)
        run: |
          docker run -d --name portal -p 3000:3000 \
            -e ADMIN_PASSWORD=ci -e ADMIN_SECRET=ci-fake-secret-precisa-de-32-chars-no-minimo-aqui \
            -e UNIFI_URL=https://example.invalid -e UNIFI_USERNAME=ci -e UNIFI_PASSWORD=ci \
            unifi-captive-portal:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/healthz; then echo; break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:3000/admin/login
          docker logs portal
